name: AI Research Desk

on:
  workflow_dispatch:
  schedule:
    # KST 07:00, 17:00, 22:00
    - cron: "0 22 * * *"
    - cron: "0 8 * * *"
    - cron: "0 13 * * *"

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Telegram research report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          SCREEN_UNIVERSE: ${{ vars.SCREEN_UNIVERSE }}
        run: python src/research_desk.py --once
